name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'deploy/**'
      - 'rust/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run Cargo tests
        run: |
          cargo test --verbose

      - name: Build WebAssembly package
        run: |
          cd crates/engine && wasm-pack build --target web --out-dir ../../pkg

      - name: Run Site smoke tests
        run: |
          python3 tests/test_site.py

      - name: Prepare static site distribution
        run: |
          mkdir -p dist
          cp index.html styles.css dist/
          cp -r src dist/src
          cp -r pkg dist/pkg
          cp -r bridge dist/bridge
          # Create a .nojekyll file to prevent GitHub Pages from ignoring files beginning with underscore
          touch dist/.nojekyll

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  # deploy-pages must run in a job that declares the github-pages environment, and only
  # main may deploy to it, so deployment is its own job after the build (#46).
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
