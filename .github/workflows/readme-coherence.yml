name: README coherence

# Keeps the canonical README honest. Every run compares the claims in README.md
# with the code, rewrites the pinned "[Coherence] README vs code" report, and
# opens or updates one issue per untracked mismatch. See
# scripts/readme_coherence.py and CONTRIBUTING.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: readme-coherence
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Always audit the default branch, never a PR's code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Compare README with code
        run: python3 scripts/readme_coherence.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
