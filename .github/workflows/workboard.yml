name: Workboard

# Keeps the pinned "[Workboard] Live: who's working on what" issue up to date:
# active branches, their owners, PRs and files, and any file changed on more than one
# branch. See CONTRIBUTING.md for how claims work.

on:
  push:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft, edited]
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: workboard
  cancel-in-progress: true

jobs:
  board:
    # Don't react to the board's own updates.
    if: github.event_name != 'issues' || !startsWith(github.event.issue.title, '[Workboard]')
    runs-on: ubuntu-latest
    steps:
      # Always run the script from the default branch, never from a PR's code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update the workboard issue
        run: python3 scripts/workboard.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
