[package]
name = "mind-over-chicken-engine"
version = "0.1.0"
edition = "2021"
authors = ["Mind Over Chicken Team"]
description = "WebAssembly + WebGL engine for Mind Over Chicken"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
moc-planet = { path = "../moc-planet" }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "Node",
    "NodeList",
    "WebGlRenderingContext",
    "WebGlShader",
    "WebGlProgram",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "Performance",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "BiquadFilterNode",
    "BiquadFilterType",
    "AudioBuffer",
    "AudioBufferSourceNode",
]
