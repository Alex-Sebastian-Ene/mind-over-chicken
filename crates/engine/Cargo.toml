[package]
name = "mind-over-chicken-engine"
version = "0.1.0"
edition = "2021"
authors = ["Mind Over Chicken Team"]
description = "WebAssembly + WebGL engine for Mind Over Chicken"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
moc-ai = { path = "../moc-ai" }
moc-brain = { path = "../moc-brain" }
moc-cosmos = { path = "../moc-cosmos" }
moc-planet = { path = "../moc-planet" }
moc-terrain = { path = "../moc-terrain" }
moc-diffusion = { path = "../moc-diffusion" }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "HtmlCollection",
    "Node",
    "NodeList",
    "WebGlRenderingContext",
    "WebGlShader",
    "WebGlProgram",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "Performance",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "BiquadFilterNode",
    "BiquadFilterType",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "EventTarget",
    "Event",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
]
