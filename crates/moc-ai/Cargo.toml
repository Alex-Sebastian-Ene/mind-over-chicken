[package]
name = "moc-ai"
description = "Pure-Rust PPO policy runtime and AI god for Mind over Chicken"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Alex-Sebastian-Ene/mind-over-chicken"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["wasm-bindgen"]
