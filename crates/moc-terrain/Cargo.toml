[package]
name = "moc-terrain"
description = "Deterministic procedural planetary terrain generator for Mind over Chicken: plate tectonics, Whittaker biomes, hydrology, rivers, and chunky pixel art"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Alex-Sebastian-Ene/mind-over-chicken"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
moc-planet = { path = "../moc-planet" }

[features]
default = []
wasm = []
